<svg xmlns="http://www.w3.org/2000/svg" width="860" height="260" viewBox="0 0 860 260" role="img" aria-label="Profile Signal — public GitHub statistics"><title>Profile Signal — public GitHub statistics</title><defs><linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#042f2e"/><stop offset=".54" stop-color="#134e4a"/><stop offset="1" stop-color="#042f2e"/></linearGradient><clipPath id="canvas"><rect width="860" height="260" rx="20"/></clipPath><radialGradient id="light-0"><stop stop-color="#2dd4bf" stop-opacity="0.72"/><stop offset=".58" stop-color="#2dd4bf" stop-opacity=".18"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient><radialGradient id="light-1"><stop stop-color="#22d3ee" stop-opacity="0.5"/><stop offset=".58" stop-color="#22d3ee" stop-opacity=".18"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient><radialGradient id="light-2"><stop stop-color="#4f8cff" stop-opacity="0.72"/><stop offset=".58" stop-color="#4f8cff" stop-opacity=".18"/><stop offset="1" stop-color="#4f8cff" stop-opacity="0"/></radialGradient><radialGradient id="light-3"><stop stop-color="#a78bfa" stop-opacity="0.5"/><stop offset=".58" stop-color="#a78bfa" stop-opacity=".18"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient></defs><style>.drift{animation:float 10s ease-in-out infinite;opacity:.65}.drift-1{animation-duration:12s;animation-delay:-3s}.drift-2{animation-duration:14s;animation-direction:reverse}.drift-3{animation-duration:11s;animation-delay:-5s}.enter{animation:arrive .65s ease-out both}.bar{transform-box:fill-box;transform-origin:left;animation:grow 1.15s ease-out both}.cursor{animation:blink 1.1s step-end infinite}.orbit{opacity:.12;animation:glimmer 8s ease-in-out infinite}@keyframes float{0%,100%{transform:translate(0,0);opacity:.58}50%{transform:translate(25px,-17px);opacity:.86}}@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes glimmer{0%,100%{opacity:.07}50%{opacity:.22}}@media(prefers-reduced-motion:reduce){.drift,.enter,.bar,.cursor,.orbit{animation:none!important}}</style><g clip-path="url(#canvas)"><rect width="860" height="260" fill="url(#base)"/><ellipse class="drift drift-0" cx="138" cy="47" rx="206" ry="120" fill="url(#light-0)"/><ellipse class="drift drift-1" cx="654" cy="57" rx="241" ry="109" fill="url(#light-1)"/><ellipse class="drift drift-2" cx="499" cy="229" rx="310" ry="88" fill="url(#light-2)"/><ellipse class="drift drift-3" cx="826" cy="203" rx="172" ry="109" fill="url(#light-3)"/><g class="orbit" fill="none" stroke="#ccfbf1" transform="translate(735 82)"><circle r="21"/><circle r="36"/><circle r="58"/></g><rect x="28" y="26" width="804" height="206" rx="20" fill="#08080c" fill-opacity=".5" stroke="#2dd4bf" stroke-opacity=".48"/><text x="46" y="61" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" fill="#ccfbf1" font-weight="850" letter-spacing="-0.5">Profile Signal</text><text x="48" y="84" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#5eead4" font-weight="650" letter-spacing="1.2">Live GitHub profile statistics</text><g class="enter" style="animation-delay:0ms"><rect x="34" y="92" width="180" height="122" rx="18" fill="#08080c" fill-opacity=".5" stroke="#2dd4bf" stroke-opacity=".72"/><defs><clipPath id="metric-0"><rect x="54" y="136" width="140" height="39"/></clipPath></defs><text x="56" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#5eead4" font-weight="800" letter-spacing="1.4">Stars</text><text x="56" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="35" fill="#41d8c5" font-weight="900" letter-spacing="-0.8" clip-path="url(#metric-0)">3</text><rect x="56" y="186" width="136" height="7" rx="3.5" fill="#ffffff" fill-opacity=".1"/><rect class="bar" x="56" y="186" width="11" height="7" rx="3.5" fill="#41d8c5" opacity=".9"/></g><g class="enter" style="animation-delay:100ms"><rect x="238" y="92" width="180" height="122" rx="18" fill="#08080c" fill-opacity=".5" stroke="#2dd4bf" stroke-opacity=".72"/><defs><clipPath id="metric-1"><rect x="258" y="136" width="140" height="39"/></clipPath></defs><text x="260" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#5eead4" font-weight="800" letter-spacing="1.4">Contributions</text><text x="260" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="35" fill="#9776f9" font-weight="900" letter-spacing="-0.8" clip-path="url(#metric-1)">608</text><rect x="260" y="186" width="136" height="7" rx="3.5" fill="#ffffff" fill-opacity=".1"/><rect class="bar" x="260" y="186" width="136" height="7" rx="3.5" fill="#9776f9" opacity=".9"/></g><g class="enter" style="animation-delay:200ms"><rect x="442" y="92" width="180" height="122" rx="18" fill="#08080c" fill-opacity=".5" stroke="#2dd4bf" stroke-opacity=".72"/><defs><clipPath id="metric-2"><rect x="462" y="136" width="140" height="39"/></clipPath></defs><text x="464" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#5eead4" font-weight="800" letter-spacing="1.4">Repos</text><text x="464" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="35" fill="#4f8cff" font-weight="900" letter-spacing="-0.8" clip-path="url(#metric-2)">6</text><rect x="464" y="186" width="136" height="7" rx="3.5" fill="#ffffff" fill-opacity=".1"/><rect class="bar" x="464" y="186" width="11" height="7" rx="3.5" fill="#4f8cff" opacity=".9"/></g><g class="enter" style="animation-delay:300ms"><rect x="646" y="92" width="180" height="122" rx="18" fill="#08080c" fill-opacity=".5" stroke="#2dd4bf" stroke-opacity=".72"/><defs><clipPath id="metric-3"><rect x="666" y="136" width="140" height="39"/></clipPath></defs><text x="668" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#5eead4" font-weight="800" letter-spacing="1.4">Followers</text><text x="668" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="35" fill="#2ad5ef" font-weight="900" letter-spacing="-0.8" clip-path="url(#metric-3)">5</text><rect x="668" y="186" width="136" height="7" rx="3.5" fill="#ffffff" fill-opacity=".1"/><rect class="bar" x="668" y="186" width="11" height="7" rx="3.5" fill="#2ad5ef" opacity=".9"/></g></g><rect x=".5" y=".5" width="859" height="259" rx="19.5" fill="none" stroke="#2dd4bf" stroke-opacity=".62"/></svg>