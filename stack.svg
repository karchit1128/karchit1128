<svg xmlns="http://www.w3.org/2000/svg" width="860" height="280" viewBox="0 0 860 280" role="img" aria-label="Language Stack — public repository technologies"><title>Language Stack — public repository technologies</title><defs><linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#042f2e"/><stop offset=".54" stop-color="#134e4a"/><stop offset="1" stop-color="#042f2e"/></linearGradient><clipPath id="canvas"><rect width="860" height="280" rx="20"/></clipPath><radialGradient id="light-0"><stop stop-color="#2dd4bf" stop-opacity="0.72"/><stop offset=".58" stop-color="#2dd4bf" stop-opacity=".18"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient><radialGradient id="light-1"><stop stop-color="#22d3ee" stop-opacity="0.5"/><stop offset=".58" stop-color="#22d3ee" stop-opacity=".18"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient><radialGradient id="light-2"><stop stop-color="#4f8cff" stop-opacity="0.72"/><stop offset=".58" stop-color="#4f8cff" stop-opacity=".18"/><stop offset="1" stop-color="#4f8cff" stop-opacity="0"/></radialGradient><radialGradient id="light-3"><stop stop-color="#a78bfa" stop-opacity="0.5"/><stop offset=".58" stop-color="#a78bfa" stop-opacity=".18"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient></defs><style>.drift{animation:float 10s ease-in-out infinite;opacity:.65}.drift-1{animation-duration:12s;animation-delay:-3s}.drift-2{animation-duration:14s;animation-direction:reverse}.drift-3{animation-duration:11s;animation-delay:-5s}.enter{animation:arrive .65s ease-out both}.bar{transform-box:fill-box;transform-origin:left;animation:grow 1.15s ease-out both}.cursor{animation:blink 1.1s step-end infinite}.orbit{opacity:.12;animation:glimmer 8s ease-in-out infinite}@keyframes float{0%,100%{transform:translate(0,0);opacity:.58}50%{transform:translate(25px,-17px);opacity:.86}}@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes glimmer{0%,100%{opacity:.07}50%{opacity:.22}}@media(prefers-reduced-motion:reduce){.drift,.enter,.bar,.cursor,.orbit{animation:none!important}}</style><g clip-path="url(#canvas)"><rect width="860" height="280" fill="url(#base)"/><ellipse class="drift drift-0" cx="138" cy="50" rx="206" ry="129" fill="url(#light-0)"/><ellipse class="drift drift-1" cx="654" cy="62" rx="241" ry="118" fill="url(#light-1)"/><ellipse class="drift drift-2" cx="499" cy="246" rx="310" ry="95" fill="url(#light-2)"/><ellipse class="drift drift-3" cx="826" cy="218" rx="172" ry="118" fill="url(#light-3)"/><rect x="28" y="26" width="804" height="226" rx="20" fill="#08080c" fill-opacity=".5" stroke="#2dd4bf" stroke-opacity=".5"/><text x="46" y="61" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="27" fill="#ccfbf1" font-weight="850" letter-spacing="-0.4">Language Stack</text><text x="48" y="84" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#5eead4" font-weight="650" letter-spacing="1.1">Repository-weighted technologies</text><text x="685" y="62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#2dd4bf" font-weight="750">&gt; stack.scan</text><text x="786" y="62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#2dd4bf" font-weight="850" class="cursor">_</text><g class="enter" style="animation-delay:0ms"><circle cx="54" cy="107" r="5" fill="#4b8cd2"/><defs><clipPath id="language-0"><rect x="71" y="94" width="207" height="25"/></clipPath></defs><text x="72" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#ccfbf1" font-weight="800" clip-path="url(#language-0)">TypeScript</text><text x="306" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-