<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="860" height="200" viewBox="0 0 860 200" role="img" aria-label="About Archit Kumar">
<title>About Archit Kumar</title>
<defs>
<linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f8fc"/><stop offset=".54" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f8fc"/></linearGradient>
<radialGradient id="glow-0"><stop stop-color="#26baa8" stop-opacity="0.26"/><stop offset=".58" stop-color="#26baa8" stop-opacity=".08"/><stop offset="1" stop-color="#26baa8" stop-opacity="0"/></radialGradient><radialGradient id="glow-1"><stop stop-color="#10b7d0" stop-opacity="0.2"/><stop offset=".58" stop-color="#10b7d0" stop-opacity=".08"/><stop offset="1" stop-color="#10b7d0" stop-opacity="0"/></radialGradient><radialGradient id="glow-2"><stop stop-color="#004ee0" stop-opacity="0.26"/><stop offset=".58" stop-color="#004ee0" stop-opacity=".08"/><stop offset="1" stop-color="#004ee0" stop-opacity="0"/></radialGradient><radialGradient id="glow-3"><stop stop-color="#3d09d7" stop-opacity="0.2"/><stop offset=".58" stop-color="#3d09d7" stop-opacity=".08"/><stop offset="1" stop-color="#3d09d7" stop-opacity="0"/></radialGradient>
<clipPath id="frame"><rect width="860" height="200" rx="20"/></clipPath>
</defs>
<style>
.drift{transform-box:fill-box;transform-origin:center;animation:drift-one 9s ease-in-out infinite}
.drift-1{animation:drift-two 11s ease-in-out 1.1s infinite}.drift-2{animation:drift-three 13s ease-in-out .6s infinite}
.drift-3{animation:drift-two 11s ease-in-out 1.1s infinite}
.ring{animation:ring-fade 8s ease-in-out infinite}.ring-1{animation-duration:10s;animation-delay:1.6s}
.chip{animation:chip-enter .65s ease-out both}.cursor{animation:cursor-blink 1.1s step-end infinite}
@keyframes drift-one{0%,100%{transform:translate(0,0);opacity:.58}50%{transform:translate(28px,-20px);opacity:.86}}
@keyframes drift-two{0%,100%{transform:translate(0,0);opacity:.42}50%{transform:translate(-24px,18px);opacity:.72}}
@keyframes drift-three{0%,100%{transform:translate(0,0) scale(1);opacity:.34}50%{transform:translate(18px,-12px) scale(1.18);opacity:.62}}
@keyframes ring-fade{0%,100%{opacity:.06}50%{opacity:.22}}
@keyframes chip-enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes cursor-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.drift,.ring,.chip,.cursor{animation:none!important}}
</style>
<g clip-path="url(#frame)"><rect width="860" height="200" fill="url(#background)"/>
<ellipse class="drift drift-0" cx="138" cy="36" rx="206" ry="92" fill="url(#glow-0)"/><ellipse class="drift drift-1" cx="654" cy="44" rx="241" ry="84" fill="url(#glow-1)"/><ellipse class="drift drift-2" cx="499" cy="176" rx="310" ry="68" fill="url(#glow-2)"/><ellipse class="drift drift-3" cx="826" cy="156" rx="172" ry="84" fill="url(#glow-3)"/><circle class="ring ring-0" cx="748" cy="100" r="25" fill="none" stroke="#26baa8" stroke-width="1" opacity=".10"/><circle class="ring ring-1" cx="748" cy="100" r="43" fill="none" stroke="#26baa8" stroke-width="1" opacity=".10"/><circle class="ring ring-2" cx="748" cy="100" r="70" fill="none" stroke="#26baa8" stroke-width="1" opacity=".10"/>
<rect x="26" y="24" width="808" height="152" rx="20" fill="#ffffff" fill-opacity="1" stroke="#d7dee8" stroke-opacity=".50"/>
<defs><clipPath id="about-copy"><rect x="44" y="75" width="758" height="65"/></clipPath></defs><text x="48" y="62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif" font-size="11" font-weight="800" fill="#475569" letter-spacing="4">ABOUT</text><text x="46" y="102" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif" font-size="24" font-weight="820" fill="#0f172a" letter-spacing="-.4" clip-path="url(#about-copy)">Co-Founder &amp; CTO @ CampusOS | Software</text><text x="46" y="134" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif" font-size="24" font-weight="820" fill="#0f172a" letter-spacing="-.4" clip-path="url(#about-copy)">Engineer @ Earthling Aid Tech</text><text x="48" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif" font-size="13" font-weight="750" fill="#26baa8" >&gt; open to collaboration</text><text x="217" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif" font-size="13" font-weight="750" fill="#26baa8" class="cursor">_</text></g><rect x=".5" y=".5" width="859" height="199" rx="20" fill="none" stroke="#d7dee8" stroke-opacity=".62"/></svg>