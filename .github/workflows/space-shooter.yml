name: Generate Space Shooter

on:
  schedule:
    # run every 24 hours
    - cron: "0 0 * * *"
  
  # allows to manually run the job at any time
  workflow_dispatch:
  
  # run on every push on the master branch
  push:
    branches:
    - main
    - master
    
jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Images & Clean SVGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          python -m pip install "gh-space-shooter==2.0.4" requests
          gh-space-shooter ${{ github.repository_owner }} --output dist/github-space-shooter.gif
          
          cat << 'EOF' > clean_svgs.py
          import requests, re, time
          
          urls = {
              "wordmark.svg": "https://www.gitskins.com/api/section/wordmark?username=${{ github.repository_owner }}&theme=aurora&label=Archit%20Kumar",
              "hero-light.svg": "https://www.gitskins.com/api/section/hero?username=${{ github.repository_owner }}&theme=aurora&mode=light",
              "hero-dark.svg": "https://www.gitskins.com/api/section/hero?username=${{ github.repository_owner }}&theme=aurora&mode=dark",
              "about-light.svg": "https://www.gitskins.com/api/section/about?username=${{ github.repository_owner }}&theme=aurora&mode=light",
              "about-dark.svg": "https://www.gitskins.com/api/section/about?username=${{ github.repository_owner }}&theme=aurora&mode=dark",
              "projects.svg": "https://www.gitskins.com/api/section/projects?username=${{ github.repository_owner }}&theme=aurora&repos=${{ github.repository_owner }}/Lumora,${{ github.repository_owner }}/Bullish-Idea",
              "stack.svg": "https://www.gitskins.com/api/section/stack?username=${{ github.repository_owner }}&theme=aurora",
              "stats.svg": "https://www.gitskins.com/api/section/stats?username=${{ github.repository_owner }}&theme=aurora",
              "highlights.svg": "https://www.gitskins.com/api/section/highlights?username=${{ github.repository_owner }}&theme=aurora&items=Robotics::Building%20autonomous%20systems|AI%20Tools::Developing%20intelligent%20software|Embedded%20Systems::Bridging%20silicon%20and%20code"
          }
          
          for filename, url in urls.items():
              for attempt in range(5):
                  print(f"Fetching {filename} (Attempt {attempt+1})...")
                  try:
                      resp = requests.get(url, timeout=15)
                      content = resp.text
                      if content.strip().endswith('</svg>'):
                          # Clean the watermark
                          cleaned = re.sub(r'<text[^>]*>gitskins\.com</text>', '', content)
                          with open(f"dist/{filename}", "w", encoding="utf-8") as f:
                              f.write(cleaned)
                          print(f"Successfully saved and cleaned {filename}")
                          break
                      else:
                          print("Warning: Truncated SVG received. Retrying...")
                          time.sleep(2)
                  except Exception as e:
                      print(f"Error: {e}. Retrying...")
                      time.sleep(2)
          EOF
          
          python clean_svgs.py
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
