name: Generate Space Shooter

on:
  schedule:
    # run every 24 hours
    - cron: "0 0 * * *"
  
  # allows to manually run the job at any time
  workflow_dispatch:
  
  # run on every push on the master branch
  push:
    branches:
    - main
    - master
    
jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Space Shooter GIF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          python -m pip install "gh-space-shooter==2.0.4"
          gh-space-shooter ${{ github.repository_owner }} --output dist/github-space-shooter.gif
          
      - name: Fetch and clean GitSkins SVGs
        run: |
          mkdir -p dist
          
          echo "Downloading SVGs..."
          curl -s "https://www.gitskins.com/api/section/about?username=${{ github.repository_owner }}&theme=aurora&mode=light" -o dist/about-light.svg
          curl -s "https://www.gitskins.com/api/section/about?username=${{ github.repository_owner }}&theme=aurora&mode=dark" -o dist/about-dark.svg
          curl -s "https://www.gitskins.com/api/section/projects?username=${{ github.repository_owner }}&theme=aurora" -o dist/projects.svg
          curl -s "https://www.gitskins.com/api/section/stack?username=${{ github.repository_owner }}&theme=aurora" -o dist/stack.svg
          curl -s "https://www.gitskins.com/api/section/stats?username=${{ github.repository_owner }}&theme=aurora" -o dist/stats.svg
          curl -s "https://www.gitskins.com/api/section/highlights?username=${{ github.repository_owner }}&theme=aurora&items=Robotics::Building%20autonomous%20systems|AI%20Tools::Developing%20intelligent%20software|Embedded%20Systems::Bridging%20silicon%20and%20code" -o dist/highlights.svg
          
          echo "Removing watermarks..."
          sed -i '/gitskins.com/d' dist/*.svg
            
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
