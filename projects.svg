<svg xmlns="http://www.w3.org/2000/svg" width="860" height="274" viewBox="0 0 860 274" role="img" aria-label="Selected GitHub projects">
<title>Selected GitHub projects</title>
<defs><linearGradient id="project-surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#042f2e"/><stop offset=".54" stop-color="#134e4a"/><stop offset="1" stop-color="#042f2e"/></linearGradient><clipPath id="project-bounds"><rect width="860" height="274" rx="20"/></clipPath><radialGradient id="project-glow-0"><stop stop-color="#2dd4bf" stop-opacity=".55"/><stop offset=".6" stop-color="#2dd4bf" stop-opacity=".14"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient><radialGradient id="project-glow-1"><stop stop-color="#22d3ee" stop-opacity=".55"/><stop offset=".6" stop-color="#22d3ee" stop-opacity=".14"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient><radialGradient id="project-glow-2"><stop stop-color="#4f8cff" stop-opacity=".55"/><stop offset=".6" stop-color="#4f8cff" stop-opacity=".14"/><stop offset="1" stop-color="#4f8cff" stop-opacity="0"/></radialGradient><radialGradient id="project-glow-3"><stop stop-color="#a78bfa" stop-opacity=".55"/><stop offset=".6" stop-color="#a78bfa" stop-opacity=".14"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient></defs>
<style>.glow{animation:project-drift 11s ease-in-out infinite}.glow-1{animation-delay:-3s}.glow-2{animation-delay:-6s}.glow-3{animation-delay:-8s}.repository{animation:project-enter .65s ease-out both}.cursor{animation:project-blink 1.2s steps(2,end) infinite}@keyframes project-drift{0%,100%{opacity:.65}50%{opacity:1;transform:translate(12px,-8px)}}@keyframes project-enter{from{opacity:.2}to{opacity:1}}@keyframes project-blink{0%,45%{opacity:1}50%,95%{opacity:0}}@media(prefers-reduced-motion:reduce){.glow,.repository,.cursor{animation:none!important}}</style>
<g clip-path="url(#project-bounds)"><rect width="860" height="274" rx="20" fill="url(#project-surface)"/><ellipse class="glow glow-0" cx="138" cy="49" rx="206" ry="126" fill="url(#project-glow-0)"/><ellipse class="glow glow-1" cx="654" cy="60" rx="241" ry="115" fill="url(#project-glow-1)"/><ellipse class="glow glow-2" cx="499" cy="241" rx="310" ry="93" fill="url(#project-glow-2)"/><ellipse class="glow glow-3" cx="826" cy="214" rx="172" ry="115" fill="url(#project-glow-3)"/>
<text x="30" y="40" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#2dd4bf" letter-spacing="2">PROJECTS.LIST</text>
<text x="180" y="40" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#5eead4" fill-opacity=".8">./projects.sh --all</text>
<text x="830" y="40" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#5eead4" text-anchor="end" fill-opacity=".7">1 project</text>
