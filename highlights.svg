<svg xmlns="http://www.w3.org/2000/svg" width="860" height="180" viewBox="0 0 860 180" role="img" aria-label="Highlights — robotics, AI tools, embedded systems"><title>Highlights — robotics, AI tools, embedded systems</title><defs><linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#042f2e"/><stop offset=".54" stop-color="#134e4a"/><stop offset="1" stop-color="#042f2e"/></linearGradient><clipPath id="canvas"><rect width="860" height="180" rx="20"/></clipPath><radialGradient id="light-0"><stop stop-color="#2dd4bf" stop-opacity="0.72"/><stop offset=".58" stop-color="#2dd4bf" stop-opacity=".18"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient><radialGradient id="light-1"><stop stop-color="#22d3ee" stop-opacity="0.5"/><stop offset=".58" stop-color="#22d3ee" stop-opacity=".18"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient><radialGradient id="light-2"><stop stop-color="#4f8cff" stop-opacity="0.72"/><stop offset=".58" stop-color="#4f8cff" stop-opacity=".18"/><stop offset="1" stop-color="#4f8cff" stop-opacity="0"/></radialGradient><radialGradient id="light-3"><stop stop-color="#a78bfa" stop-opacity="0.5"/><stop offset=".58" stop-color="#a78bfa" stop-opacity=".18"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient></defs><style>.drift{animation:float 10s ease-in-out infinite;opacity:.65}.drift-1{animation-duration:12s;animation-delay:-3s}.drift-2{animation-duration:14s;animation-direction:reverse}.drift-3{animation-duration:11s;animation-delay:-5s}.enter{animation:arrive .65s ease-out both}.bar{transform-box:fill-box;transform-origin:left;animation:grow 1.15s ease-out both}.cursor{animation:blink 1.1s step-end infinite}.orbit{opacity:.12;animation:glimmer 8s ease-in-out infinite}@keyframes float{0%,100%{transform:translate(0,0);opacity:.58}50%{transform:translate(25px,-17px);opacity:.86}}@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes glimmer{0%,100%{opacity:.07}50%{opacity:.22}}@media(prefers-reduced-motion:reduce){.drift,.enter,.bar,.cursor,.orbit{animation:none!important}}</style><g clip-path="url(#canvas)"><rect width="860" height="180" fill="url(#base)"/><ellipse class="drift drift-0" cx="138" cy="32" rx="206" ry="83" fill="url(#light-0)"/><ellipse class="drift drift-1" cx="654" cy="40" rx="241" ry="76" fill="url(#light-1)"/><ellipse class="drift drift-2" cx="499" cy="158" rx="310" ry="61" fill="url(#light-2)"/><ellipse class="drift drift-3" cx="826" cy="140" rx="172" ry="76" fill="url(#light-3)"/><text x="30" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#5eead4" font-weight="800" letter-spacing="4">HIGHLIGHTS</text><g class="enter" style="animation-delay:0ms"><rect x="28" y="60" width="257" height="96" rx="16" fill="#08080c" fill-opacity=".5" stroke="#2dd4bf" stroke-opacity=".7"/><rect x="28" y="82" width="4" height="52" rx="2" fill="#41d8c5"/><text x="52" y="98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#ccfbf1" font-weight="850">Robotics</text><text x="52" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" fill="#5eead4" font-weight="400">Building autonomous systems</text></g><g class="enter" style="animation-delay:90ms"><rect x="301" y="60" width="257" height="96" rx="16" fill="#08080c" fill-opacity=".5" stroke="#2dd4bf" stroke-opacity=".7"/><rect x="301" y="82" width="4" height="52" rx="2" fill="#2ad5ef"/><text x="325" y="98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#ccfbf1" font-weight="850">AI Tools</text><text x="325" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" fill="#5eead4" font-weight="400">Developing intelligent</text><text x="325" y="139" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" fill="#5eead4" font-weight="400">software</text></g><g class="enter" style="animation-delay:180ms"><rect x="574" y="60" width="257" height="96" rx="16" fill="#08080c" fill-opacity=".5" stroke="#2dd4bf" stroke-opacity=".7"/><rect x="574" y="82" width="4" height="52" rx="2" fill="#4f8cff"/><text x="598" y="98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#ccfbf1" font-weight="850">Embedded Systems</text><text x="598" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" fill="#5eead4" font-weight="400">Bridging silicon and code</text></g></g><rect x=".5" y=".5" width="859" height="179" rx="19.5" fill="none" stroke="#2dd4bf" stroke-opacity=".62"/></svg>